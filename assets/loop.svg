<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="How claude-starter works. Hooks load the rules at session start, log every subagent call and run the review gate at stop. You shape an idea with /grill, visual-plan and /review-setup. The lead writes no code and picks a role by the type of task: locator (Haiku) finds and lists, reader (Opus, medium effort) reads and reports, writer (Sonnet, high effort) changes files and is re-sent on Opus when its checks fail twice, reviewer (Opus, high effort) checks with a fresh context and REVIEW.md. For a task that fits no role the lead picks the model and effort itself. diff-walkthrough, /clean-worktrees and /monthly-review come after.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8079"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d97757"/></marker>
    <style>
      .t{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .h{font-size:13px;letter-spacing:2px;fill:#8a8079;font-weight:600}
      .b{fill:#232020;stroke:#3a3431;stroke-width:1.5}
      .n{font-size:17px;font-weight:700;fill:#f5f0eb}
      .s{font-size:13px;fill:#a89d96}
      .tag{fill:none;stroke:#d97757;stroke-width:1.2}
      .tagt{font-size:12px;font-weight:600;fill:#e7a98f}
    </style>
  </defs>
  <rect width="1200" height="820" rx="24" fill="#161412"/>

  <!-- hooks rail -->
  <g class="t">
    <rect x="30" y="26" width="1140" height="46" rx="12" fill="#1c1917" stroke="#2e2926"/>
    <text x="50" y="55" class="h">HOOKS</text>
    <circle cx="140" cy="49" r="5" fill="#d97757"/>
    <text x="154" y="54" font-size="15" fill="#f5f0eb">Session start: working rules</text>
    <circle cx="430" cy="49" r="5" fill="#d97757"/>
    <text x="444" y="54" font-size="15" fill="#f5f0eb">Every subagent call is logged</text>
    <circle cx="730" cy="49" r="5" fill="#d97757"/>
    <text x="744" y="54" font-size="15" fill="#f5f0eb">Stop: review gate <tspan class="s">asks once if code changed unreviewed</tspan></text>
  </g>

  <!-- shape -->
  <g class="t">
    <text x="40" y="118" class="h">SHAPE</text>
    <rect x="30" y="132" width="200" height="74" rx="14" class="b"/>
    <text x="50" y="162" class="n m">/grill</text>
    <text x="50" y="186" class="s">settle the idea, card by card</text>
    <rect x="30" y="222" width="200" height="74" rx="14" class="b"/>
    <text x="50" y="252" class="n m">visual-plan</text>
    <text x="50" y="276" class="s">plan as a visual contract</text>
    <rect x="30" y="312" width="200" height="74" rx="14" class="b"/>
    <text x="50" y="342" class="n m">/review-setup</text>
    <text x="50" y="366" class="s">draft REVIEW.md once</text>
  </g>

  <!-- you + lead -->
  <g class="t">
    <rect x="290" y="132" width="230" height="64" rx="14" fill="none" stroke="#5c544e" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="405" y="160" text-anchor="middle" class="n">You</text>
    <text x="405" y="182" text-anchor="middle" class="s">decide, approve</text>
    <path d="M405 196 V226" stroke="#8a8079" stroke-width="2" marker-end="url(#a)"/>
    <rect x="290" y="232" width="230" height="176" rx="18" fill="#d97757"/>
    <text x="405" y="268" text-anchor="middle" font-size="22" font-weight="700" fill="#161412">Lead</text>
    <text x="405" y="292" text-anchor="middle" font-size="14" fill="#2b1f19">your main session</text>
    <text x="405" y="322" text-anchor="middle" font-size="15" fill="#161412">asks · plans · reads diffs</text>
    <text x="405" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#161412">writes no code</text>
    <text x="405" y="376" text-anchor="middle" font-size="14" fill="#161412">picks a role by the type of task;</text>
    <text x="405" y="394" text-anchor="middle" font-size="14" fill="#161412">the role fixes model and effort</text>
    <path d="M230 259 H282" stroke="#8a8079" stroke-width="2" marker-end="url(#a)"/>
  </g>

  <!-- read lane -->
  <g class="t">
    <text x="600" y="118" class="h">READ · IN PARALLEL</text>
    <rect x="590" y="132" width="180" height="82" rx="14" class="b"/>
    <text x="608" y="160" class="n m">locator</text>
    <text x="608" y="181" class="s">finds and lists</text>
    <rect x="608" y="188" width="54" height="19" rx="9.5" class="tag"/><text x="635" y="202" text-anchor="middle" class="tagt">Haiku</text>
    <rect x="785" y="132" width="180" height="82" rx="14" class="b"/>
    <text x="803" y="160" class="n m">reader</text>
    <text x="803" y="181" class="s">reads and reports</text>
    <rect x="803" y="188" width="110" height="19" rx="9.5" class="tag"/><text x="858" y="202" text-anchor="middle" class="tagt">Opus · medium</text>
    <rect x="980" y="132" width="190" height="82" rx="14" class="b" stroke-dasharray="5 4"/>
    <text x="998" y="160" class="n">No role fits</text>
    <text x="998" y="181" class="s">design, planning, research</text>
    <rect x="998" y="188" width="158" height="19" rx="9.5" class="tag"/><text x="1077" y="202" text-anchor="middle" class="tagt">lead picks model · effort</text>
    <path d="M520 268 C560 268 560 173 582 173" stroke="#8a8079" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="600" y="236" class="s" font-size="12">conclusions come back</text>
  </g>

  <!-- write lane -->
  <g class="t">
    <text x="600" y="268" class="h">WRITE · ONE AT A TIME</text>
    <rect x="590" y="282" width="270" height="104" rx="14" class="b"/>
    <text x="608" y="310" class="n m">writer</text>
    <text x="608" y="331" class="s">changes files · runs the checks</text>
    <rect x="608" y="340" width="104" height="19" rx="9.5" class="tag"/><text x="660" y="354" text-anchor="middle" class="tagt">Sonnet · high</text>
    <text x="608" y="376" class="s" font-size="12">checks fail twice → sent again on Opus</text>
    <text x="878" y="338" class="s" font-size="14">or</text>
    <rect x="905" y="282" width="265" height="104" rx="14" class="b"/>
    <text x="923" y="310" class="n m">/fan-out</text>
    <text x="923" y="334" class="s">builder → reviewer workflow</text>
    <text x="923" y="356" class="s">only when you approve</text>
    <path d="M520 334 H582" stroke="#d97757" stroke-width="2.5" marker-end="url(#o)"/>
  </g>

  <!-- check lane -->
  <g class="t">
    <text x="1170" y="434" class="h" text-anchor="end">CHECK · FRESH CONTEXT</text>
    <rect x="590" y="448" width="580" height="128" rx="14" class="b"/>
    <text x="608" y="478" class="n m">reviewer</text>
    <rect x="700" y="463" width="92" height="19" rx="9.5" class="tag"/><text x="746" y="477" text-anchor="middle" class="tagt">Opus · high</text>
    <text x="608" y="502" class="s">reads <tspan class="m" fill="#f5f0eb">REVIEW.md</tspan> first · review depth follows its risk tier</text>
    <text x="608" y="524" class="s">second round: new diff only · fix the whole class · stop after 3 rounds</text>
    <g font-size="13">
      <rect x="608" y="538" width="70" height="22" rx="11" fill="#1d2a1f"/><text x="643" y="553" text-anchor="middle" fill="#9cc4a4">fixed</text>
      <rect x="686" y="538" width="88" height="22" rx="11" fill="#2a2420"/><text x="730" y="553" text-anchor="middle" fill="#c9bfb8">dismissed</text>
      <rect x="782" y="538" width="104" height="22" rx="11" fill="#2a2420"/><text x="834" y="553" text-anchor="middle" fill="#c9bfb8">pre-existing</text>
      <rect x="894" y="538" width="122" height="22" rx="11" fill="#2d2118"/><text x="955" y="553" text-anchor="middle" fill="#e7a98f">needs decision</text>
    </g>
    <path d="M725 386 V440" stroke="#8a8079" stroke-width="2" marker-end="url(#a)"/>
    <text x="735" y="418" class="s" font-size="12">diff</text>
    <path d="M582 512 C520 512 450 470 420 416" stroke="#8a8079" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#a)"/>
    <text x="330" y="500" class="s" font-size="12">findings to settle;</text>
    <text x="330" y="517" class="s" font-size="12">fixes go back to the writer</text>
  </g>

  <!-- after -->
  <g class="t">
    <text x="40" y="650" class="h">AFTER</text>
    <rect x="30" y="664" width="360" height="106" rx="14" class="b"/>
    <text x="50" y="696" class="n m">diff-walkthrough</text>
    <text x="50" y="720" class="s">learn the change: a slide-style</text>
    <text x="50" y="740" class="s">tour of the diff, step by step</text>
    <rect x="410" y="664" width="370" height="106" rx="14" class="b"/>
    <text x="430" y="696" class="n m">/clean-worktrees</text>
    <text x="430" y="720" class="s">remove clean, merged worktrees and</text>
    <text x="430" y="740" class="s">branches; never deletes through a link</text>
    <rect x="800" y="664" width="370" height="106" rx="14" class="b"/>
    <text x="820" y="696" class="n m">/monthly-review</text>
    <text x="820" y="720" class="s">check /insights against your setup,</text>
    <text x="820" y="740" class="s">apply at most two, prune stale memory</text>
  </g>
</svg>
